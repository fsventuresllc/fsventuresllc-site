name: API

# cs-waitlist: tests and typecheck for the shared waitlist endpoint (api/).
# Not a deploy gate: the Render web service deploys on push to main independently of this check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace=api
      - run: npm run typecheck --workspace=api
      - run: npm run build --workspace=api
